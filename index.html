<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Glass OCR</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/ui.js"></script>
</head>
<body>
  <main class="window">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true">⟐</span>Glass OCR</div>
      <div class="languages" role="group" aria-label="Language" id="languages">
        <button type="button" id="en" aria-pressed="true">EN</button>
        <button type="button" id="ru" aria-pressed="false">RU</button>
      </div>
    </header>
    <section class="intro">
      <h1 data-t="title">PDF to editable files</h1>
      <p data-t="subtitle">Recognize text and tables on your device with OCRia-nano-1.</p>
    </section>
    <form id="form">
      <input type="file" id="pdf" accept=".pdf,application/pdf" hidden>
      <button type="button" class="drop" id="drop">
        <span class="scan" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><path d="M6 13V8a2 2 0 0 1 2-2h5m10 0h5a2 2 0 0 1 2 2v5m0 10v5a2 2 0 0 1-2 2h-5m-10 0H8a2 2 0 0 1-2-2v-5m6-9h12m-12 4h12m-12 4h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        <strong id="file-name" data-t="drop">Drop your PDF here</strong>
        <span data-t="choose">or click to choose a file</span>
      </button>
      <div class="controls">
        <label><span data-t="format">Output format</span>
          <select id="format">
            <option value="docx">Word (.docx)</option>
            <option value="xlsx">Excel (.xlsx)</option>
            <option value="doc">Word 97–2003 (.doc)</option>
            <option value="pages">Apple Pages (.pages)</option>
          </select>
        </label>
        <label><span data-t="range">Pages</span>
          <input id="pages" placeholder="1–3, 5" autocomplete="off" maxlength="100">
        </label>
      </div>
      <p id="format-note" class="note" hidden></p>
      <details>
        <summary data-t="settings">OCR settings</summary>
        <div class="settings">
          <label><span data-t="resolution">Scan resolution</span>
            <select id="dpi"><option>150</option><option selected>250</option><option>300</option><option>400</option></select>
          </label>
          <label class="check"><input id="ocr" type="checkbox" checked><span data-t="ocr">Recognize scans</span></label>
          <label class="check"><input id="headers" type="checkbox"><span data-t="headers">Keep headers and footers</span></label>
        </div>
        <p class="note" data-t="auto">OCRia automatically detects Russian and English by text line.</p>
      </details>
      <div class="actions">
        <button type="submit" id="submit" disabled data-t="convert">Convert PDF</button>
        <span class="privacy" data-t="privacy">Local processing</span>
      </div>
      <div id="status" role="status" aria-live="polite" hidden></div>
      <pre id="detail" hidden></pre>
    </form>
  </main>
</body>
</html>
